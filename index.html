<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>商品開発 原価計算ツール</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e2e6ec;--text:#1f2937;--sub:#6b7280;--pri:#1f4e79;--pri2:#2f6db0;--blue:#e5f3ff;--yellow:#fdfed6;--ng:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","游ゴシック","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
header.app{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.app h1{font-size:17px;margin:0;font-weight:700}
header.app .sp{flex:1}
header.app .save{font-size:12px;opacity:.85}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 10px;font-size:12px}
nav.tabs{display:flex;gap:4px;padding:8px 12px 0;background:#dfe6ef;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:30}
nav.tabs::-webkit-scrollbar{display:none}
.tab{background:#c9d4e2;border:none;border-radius:8px 8px 0 0;padding:9px 16px;font-weight:700;color:#334155;white-space:nowrap;font-size:14px;flex-shrink:0}
.tab.active{background:var(--bg);color:var(--pri)}
.tab .x{display:none;margin-left:8px;color:#94a3b8;font-weight:400}
.tab.active .x{display:inline}
.tab.add{background:transparent;color:var(--pri);font-size:18px;padding:6px 12px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
aside.side{padding:12px;align-self:start;position:sticky;top:52px;max-height:calc(100vh - 66px);overflow:auto}
.brandttl{font-weight:800;font-size:16px;color:var(--pri)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;font-size:13px;color:var(--text)}
.btn:hover{background:#f1f5f9}
.btn.pri{background:var(--pri2);border-color:var(--pri2);color:#fff;font-weight:700}
.btn.grn{background:#107c41;border-color:#107c41;color:#fff;font-weight:700}
.btn.red{border-color:#fecaca;color:var(--ng)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%}
input.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:#334155;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-weight:400}
.chip.set{border-style:dashed;color:var(--pri2)}
.grp h4{margin:10px 2px 4px;font-size:12px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between}
.ritem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.ritem:hover{background:#f1f5f9}
.ritem.active{background:var(--blue);border-color:#bcdcff}
.ritem .nm{flex:1;min-width:0}
.ritem .nm b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .nm small{display:block;color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .rt{text-align:right;font-size:11px;color:var(--sub);white-space:nowrap}
.ritem .rt b{display:block;font-size:14px;color:var(--pri)}
.tools{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:grid;gap:6px}
.tools .cap{font-size:11px;color:var(--sub)}
.catmgr{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fafcff}
.catmgr .row{display:flex;gap:4px;align-items:center;margin-bottom:5px}
.catmgr .row input{flex:1;padding:7px 8px;border:1px solid #cfd6df;border-radius:6px;min-width:0}
.catmgr .row button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:32px;padding:0;flex-shrink:0}
.catmgr .add{display:flex;gap:4px;margin-top:6px}
.catmgr .add input{flex:1;padding:7px 8px;border:1px solid #93c5fd;border-radius:6px;min-width:0}
main.ed{min-width:0;display:grid;gap:12px;align-content:start}
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px}
.edbar .ttl{font-weight:800;font-size:16px;flex:1;min-width:140px}
.back{display:none}
.sec{padding:14px}
.sec h3{margin:0 0 10px;font-size:14px;color:var(--pri);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3 .hint{font-weight:400;color:var(--sub);font-size:12px}
.grid-info{display:grid;grid-template-columns:170px 150px 1fr 160px;gap:10px}
.fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 9px;border:1px solid #cfd6df;border-radius:7px;background:#fff}
.fld.name input{background:var(--yellow);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fafcff}
.kpi .l{font-size:11px;color:var(--sub);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
.kpi input{width:100%;font-size:20px;font-weight:800;border:1px solid #cfd6df;border-radius:6px;padding:4px 8px;margin-top:2px;background:#fff}
.kpi.hl{background:var(--blue);border-color:#bcdcff}.kpi.hl .v{color:var(--pri)}
.ihead,.irow{display:grid;grid-template-columns:28px minmax(180px,1fr) 96px 86px 66px 86px 96px 120px;gap:6px;align-items:center}
.ihead{font-size:11px;color:var(--sub);font-weight:700;padding:0 6px 6px;border-bottom:2px solid var(--line)}
.ihead div{text-align:center}.ihead div:nth-child(2){text-align:left}
.irow{padding:6px;border-bottom:1px solid #eef1f5}
.c-no{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--pri);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.irow input{width:100%;padding:7px;border:1px solid #cfd6df;border-radius:6px;background:#fff;font-variant-numeric:tabular-nums}
.irow input[type=number],.irow input[inputmode=decimal]{text-align:right}
.irow label{display:none}
.c-cost{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.c-cost .up{font-size:10px;color:var(--sub);font-weight:400}
.c-act{display:flex;gap:3px;justify-content:flex-end}
.c-act button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:26px;height:28px;font-size:12px;padding:0 4px;color:#475569}
.c-act button.del:hover{color:var(--ng);border-color:#fecaca}
.fixednote{font-size:11px;color:var(--sub);text-align:center;grid-column:span 2}
.itotal{display:flex;justify-content:flex-end;gap:18px;padding:10px 8px 2px;font-weight:800;font-size:15px;align-items:center;flex-wrap:wrap}
.itotal .btns{margin-right:auto;display:flex;gap:6px}
#suggest{position:absolute;z-index:100;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18);max-height:260px;overflow:auto}
#suggest .sh{font-size:11px;color:var(--sub);padding:6px 10px;background:#f8fafc;font-weight:700;position:sticky;top:0}
#suggest .so{padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid #f1f5f9}
#suggest .so.on,#suggest .so:hover{background:var(--blue)}
#suggest .so small{color:var(--sub);white-space:nowrap}
.step{display:grid;grid-template-columns:70px 1fr 96px;gap:8px;align-items:start;margin-bottom:8px}
.step select{padding:7px 4px;border:1px solid #cfd6df;border-radius:6px;font-weight:700;background:var(--blue);color:var(--pri)}
.step textarea{width:100%;padding:7px 9px;border:1px solid #cfd6df;border-radius:6px;resize:vertical;min-height:38px;line-height:1.5}
.photos{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px}
.pbox{border:2px dashed #cbd5e1;border-radius:9px;min-height:170px;display:flex;align-items:center;justify-content:center;position:relative;background:#fafcff;cursor:pointer;overflow:hidden}
.pbox img{max-width:100%;max-height:240px;display:block}
.pbox .ph{color:var(--sub);font-size:12px;text-align:center;padding:10px}
.pbox .rm{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:5px;font-size:11px;padding:3px 7px}
.plabel{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px}
/* 提案会 */
nav.subtabs{display:flex;gap:6px;padding:10px 14px 0;max-width:1500px;margin:0 auto;overflow-x:auto;scrollbar-width:none;align-items:center}
nav.subtabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:#334155;white-space:nowrap}
.stab.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.stab.rec.on{background:var(--pri);border-color:var(--pri)}
.stab .n{font-weight:400;opacity:.75;margin-left:4px}
.stab.add{border-style:dashed;color:#7c3aed}
.stlabel{font-size:11px;color:var(--sub);font-weight:700;flex-shrink:0;margin-left:6px}
.pwrap{padding:14px;max-width:1300px;margin:0 auto;display:grid;gap:12px}
.phead{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.psum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ptable{width:100%;border-collapse:collapse}
.ptable th{background:#f3e8ff;color:#5b21b6;font-size:12px;padding:8px 6px;text-align:left;white-space:nowrap}
.ptable td{border-bottom:1px solid #eef1f5;padding:8px 6px;vertical-align:middle}
.ptable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptable .pn b{display:block;font-size:14px;cursor:pointer;color:var(--pri)}
.mno{display:none}
@media (max-width:900px){.mno{display:inline}}
.ptable .pn small{color:var(--sub);font-size:11px}
.ptable textarea{width:100%;min-width:180px;padding:7px 8px;border:1px solid #cfd6df;border-radius:6px;resize:vertical;min-height:38px;font-size:13px;line-height:1.4}
.ox{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
.ox button{border:none;background:#fff;width:42px;height:36px;font-size:18px;font-weight:800;color:#cbd5e1}
.ox button+button{border-left:1px solid #cbd5e1}
.ox button.on.o{background:#dcfce7;color:#15803d}
.ox button.on.x{background:#fee2e2;color:#b91c1c}
.pmv{display:flex;gap:3px}
.pmv button{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:30px;color:#475569}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:12px;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;color:#5b21b6}
.modal .mb{padding:8px 16px;overflow:auto;flex:1}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.pk{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.pk input{width:20px;height:20px;flex-shrink:0;accent-color:#7c3aed}
.pk .nm{flex:1;min-width:0}.pk .nm b{display:block;font-size:14px}.pk .nm small{color:var(--sub);font-size:11px}
.pk .rt{font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.pkg{font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 2px}
.rprop{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rprop label{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid #ddd6fe;background:#faf5ff;border-radius:999px;padding:5px 10px;cursor:pointer;color:#5b21b6;font-weight:700}
.rprop input{accent-color:#7c3aed}
@media (max-width:900px){
  .phead{grid-template-columns:1fr 1fr}.phead .pbtns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.phead .pbtns .btn{padding:10px 6px}
  .psum{grid-template-columns:1fr 1fr}
  .ptable thead{display:none}
  .ptable,.ptable tbody,.ptable tr,.ptable td{display:block;width:100%}
  .ptable tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:10px;background:#fff;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .ptable td{border:none;padding:0}
  .ptable td.tno{display:none}
  .ptable td.pn{grid-column:1/-1}
  .ptable td.num{text-align:left;font-size:15px;font-weight:700}
  .ptable td.num::before{content:attr(data-l);display:block;font-size:10px;color:var(--sub);font-weight:700}
  .ptable td.oxc{grid-column:1/2}
  .ptable td.memo{grid-column:1/-1}
  .ptable td.mv{grid-column:2/4;grid-row:3;justify-self:end;align-self:center}
  .ptable td.oxc{grid-row:3}
  .ptable textarea{font-size:16px}
  .ox button{width:52px;height:42px}
  .pmv button{width:36px;height:38px}
}
body.v-prop .fab,body.v-quick .fab,body.v-quick .mobbar{display:none!important}
.tab.tool{background:#e2e8f0;color:#334155}
.tab.tool.active{background:var(--bg);color:#0f766e}
.tab .bdg{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;line-height:18px}
.nwrap{padding:14px;max-width:1300px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:14px}
.nwrap .side{padding:12px;align-self:start;position:sticky;top:52px;max-height:calc(100vh - 66px);overflow:auto}
.nitem{padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.nitem:hover{background:#f1f5f9}.nitem.active{background:#ccfbf1;border-color:#5eead4}
.nitem b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem small{display:block;color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .pin{color:#f59e0b}
.ned{padding:14px;display:grid;gap:10px;align-content:start}
.ned .ntitle{font-size:18px;font-weight:800;border:1px solid #cfd6df;border-radius:8px;padding:10px;width:100%}
.ned textarea{width:100%;min-height:55vh;border:1px solid #cfd6df;border-radius:8px;padding:12px;font-size:15px;line-height:1.7;resize:vertical}
.ned .nbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.twrap{padding:14px;max-width:800px;margin:0 auto;display:grid;gap:12px}
.tadd{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px}
.tadd input{padding:9px;border:1px solid #cfd6df;border-radius:7px;width:100%}
.tfil{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #eef1f5}
.task .ck{width:26px;height:26px;border-radius:50%;border:2px solid #94a3b8;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.task.done .ck{background:#10b981;border-color:#10b981}
.task.done .tt{text-decoration:line-through;color:#94a3b8}
.task .tt{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:15px;font-weight:700;background:transparent}
.task .tt:hover,.task .tt:focus{border-color:#cfd6df;background:#fff}
@media (max-width:900px){
  .nwrap{grid-template-columns:1fr;padding:10px}
  .nwrap .side{position:static;max-height:none}
  body.n-edit .nwrap .side{display:none}body.n-list .nwrap .ned{display:none}
  .ned textarea{font-size:16px;min-height:60vh}.ned .ntitle{font-size:17px}
  .tadd input{font-size:16px}.tadd .btn{padding:0 18px}
  .task .tt{font-size:16px}
  .twrap{padding:10px}
}
/* 簡易計算 */
.tab.quick{background:#fde68a;color:#78350f}
.tab.quick.active{background:var(--bg);color:#92400e}
.qwrap{padding:14px;max-width:1100px;margin:0 auto;display:grid;gap:10px}
.qtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtop h2{margin:0;font-size:17px;color:#92400e;flex:1}
.qbar{padding:10px 12px;display:grid;gap:6px;position:sticky;top:44px;z-index:15}
.qbar .row1{display:flex;gap:6px;align-items:center}
.qbar input.search{margin:0;flex:1}
.qbar .chips{padding:0}
.qbar .chip.on{background:#d97706;border-color:#d97706}
.qgrp{font-size:12px;font-weight:800;color:#92400e;margin:8px 2px 0;display:flex;justify-content:space-between}
.qcard{border-left:5px solid #f59e0b;overflow:hidden}
.qsum{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
.qsum:hover{background:#fffbeb}
.qsum .arw{color:#d97706;font-size:13px;transition:transform .15s}
.qcard.open .qsum .arw{transform:rotate(90deg)}
.qsum .nm{min-width:0}
.qsum .nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qsum .nm small{display:block;color:var(--sub);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qsum .bpill{display:inline-block;font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:999px;padding:1px 8px;margin-right:6px}
.qsum .nums{display:flex;gap:16px;text-align:right;font-variant-numeric:tabular-nums}
.qsum .nums div{font-size:10px;color:var(--sub);font-weight:700;white-space:nowrap}
.qsum .nums b{display:block;font-size:15px;color:var(--text)}
.qsum .nums .rt b{color:#b45309}
.qbody{display:none;padding:0 14px 14px;border-top:1px dashed #fde68a}
.qcard.open .qbody{display:block}
.qhead{display:grid;grid-template-columns:1fr 220px auto;gap:10px;align-items:end;margin:12px 0 10px}
.qhead .x{border:1px solid #fecaca;background:#fff;color:var(--ng);border-radius:7px;height:36px;padding:0 12px}
.qh,.qr{display:grid;grid-template-columns:minmax(150px,1fr) 100px 90px 80px 90px 96px 34px;gap:6px;align-items:center}
.qh{font-size:11px;color:var(--sub);font-weight:700;padding:0 2px 5px;border-bottom:2px solid var(--line)}
.qh div{text-align:center}.qh div:first-child{text-align:left}
.qr{padding:5px 2px;border-bottom:1px solid #eef1f5}
.qr input,.qr select{width:100%;padding:7px;border:1px solid #cfd6df;border-radius:6px;background:#fff}
.qr input[inputmode=decimal]{text-align:right}
.qr label{display:none}
.qr .qc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.qr .del{border:1px solid var(--line);background:#fff;border-radius:6px;height:32px;color:#475569}
.qfoot{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px;align-items:stretch;margin-top:10px}
.qfoot .kpi input{font-size:18px}
.qfoot .kpi .v{font-size:20px}
.qadd{align-self:center}
@media (max-width:900px){
  .qwrap{padding:10px}
  .qbar{top:42px}
  .qbar input.search{font-size:16px}
  .qsum{grid-template-columns:18px minmax(0,1fr);padding:11px 12px}
  .qsum .nums{grid-column:2;justify-content:flex-start;gap:14px;text-align:left}
  .qhead{grid-template-columns:1fr 1fr}.qhead .fld:first-child{grid-column:1/-1}
  .qh{display:none}

<body class="m-list">
<header class="app">
  <h1>🍳 商品開発 原価計算</h1>
  <span class="save" id="saveState">読み込み中…</span>
  <span class="sp"></span>
  <button class="hbtn" id="btnBackup">📤 データ書き出し</button>
  <button class="hbtn" id="btnRestore">📥 データ取り込み</button>
  <input type="file" id="fileRestore" accept=".json,application/json" class="hidden">
  <input type="file" id="fileXlsx" accept=".xlsx" class="hidden">
  <input type="file" id="fileImg" accept="image/*" class="hidden">
</header>
<nav class="tabs" id="tabs"></nav>
<nav class="subtabs" id="subtabs"></nav>
<div id="view"></div>
<button class="fab" id="fab">＋ 新規商品</button>
<div class="mobbar" id="mobbar"></div>
<div id="suggest" class="hidden"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>
<datalist id="unitList"><option value="g"><option value="ml"><option value="個"><option value="本"><option value="枚"><option value="尾"><option value="切"><option value="貫"><option value="袋"><option value="缶"></datalist>
<script>
const DEFAULT_BRANDS=['CONA','ナポリマン','焼売のジョー','金目樽','寿司'];
const DB_NAME='genkaTool',STORE='kv',KEY='state_v2';
const EXCEL_CDN=['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'];
const NOCAT='__none',ALL='__all';
const TOOLPAGES=['quick','memo','task'];
let S=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).normalize('NFKC').replace(/[,¥円\s]/g,''))};
const nz=v=>{const n=num(v);return isFinite(n)?n:0};
const yen=(v,d=1)=>isFinite(v)?'¥'+v.toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const pct=v=>isFinite(v)?(v*100).toFixed(1)+'%':'—';
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　]/g,'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const isMob=()=>window.innerWidth<=900;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ===== 保存 ===== */
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej('no');const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadState(){try{const db=await idb();return await new Promise(res=>{const g=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null)})}catch(e){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}}}
let saveTimer=null;
const flush=()=>{if(saveTimer){clearTimeout(saveTimer);saveTimer=null;try{localStorage.setItem(KEY+'_bk',JSON.stringify(S))}catch(_){}doSave()}};
window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
function save(){if(S)S.ts=Date.now();$('#saveState').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(doSave,400)}
async function doSave(){saveTimer=null;
  const ok=()=>{const d=new Date();$('#saveState').textContent='✓ 自動保存 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
  try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(JSON.parse(JSON.stringify(S)),KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});ok()}
  catch(e){try{localStorage.setItem(KEY,JSON.stringify(S));ok()}catch(_){$('#saveState').textContent='⚠ 保存失敗'}}
}
function initState(){const brands=DEFAULT_BRANDS.map(n=>({id:uid('b'),name:n,cats:[],recipes:[],props:[]}));return{v:2,brands,quick:[],memos:[],tasks:[],cur:{brandId:brands[0].id,recipeId:null,cat:ALL,page:'quick'}}}

/* ===== アクセサ・計算 ===== */
const curBrand=()=>S.brands.find(b=>b.id===S.cur.brandId)||S.brands[0];
const curRecipe=()=>curBrand().recipes.find(r=>r.id===S.cur.recipeId)||null;
const catName=(b,id)=>b.cats.find(c=>c.id===id)?.name||'';
function blankItem(){return{name:'',price:'',pack:'',unit:'g',qty:'',mode:'calc'}}
function newRecipe(catId){return{id:uid('r'),catId:catId&&catId!==ALL&&catId!==NOCAT?catId:'',short:'',name:'',price:'',portion:'',items:[blankItem(),blankItem(),blankItem()],steps:[{text:''}],notes:'',photoNote:'',photo:'',photo2:'',updated:today()}}
function itemCost(it){if(it.mode==='fixed')return nz(it.cost);const p=nz(it.pack);return p>0?nz(it.price)/p*nz(it.qty):0}
function recipeCost(r){return r.items.reduce((a,it)=>a+itemCost(it),0)}
function rateOf(r){const p=num(r.price);return p>0?recipeCost(r)/p:NaN}
function setMode(m){document.body.classList.toggle('m-edit',m==='edit');document.body.classList.toggle('m-list',m!=='edit')}

/* ===== タブ ===== */
function renderTabs(){
  const q=TOOLPAGES.includes(S.cur.page),pg=S.cur.page,open=S.tasks.filter(t=>!t.done).length;
  $('#tabs').innerHTML=`<button class="tab quick ${pg==='quick'?'active':''}" data-pg="quick">🧮 簡易計算</button><button class="tab tool ${pg==='memo'?'active':''}" data-pg="memo">📝 メモ帳</button><button class="tab tool ${pg==='task'?'active':''}" data-pg="task">✅ タスク${open?`<span class="bdg" style="background:#64748b">${open}</span>`:''}</button>`
    +S.brands.map(b=>`<button class="tab ${!q&&b.id===S.cur.brandId?'active':''}" data-b="${b.id}">${esc(b.name)}<span class="x" data-del="${b.id}">✕</span></button>`).join('')+`<button class="tab add" id="addBrand" title="ブランド追加">＋</button>`;
  $('#tabs .tab.active')?.scrollIntoView({inline:'nearest',block:'nearest'});
}
$('#tabs').addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');
  if(del){e.stopPropagation();const b=S.brands.find(x=>x.id===del.dataset.del);if(S.brands.length<=1)return toast('最後のブランドは削除できません');
    if(!confirm(`ブランド「${b.name}」と商品${b.recipes.length}件を削除しますか？`))return;
    S.brands=S.brands.filter(x=>x!==b);S.cur={brandId:S.brands[0].id,recipeId:null,cat:ALL,page:'brand'};save();renderAll();return}
  const pgb=e.target.closest('[data-pg]');if(pgb){S.cur.page=pgb.dataset.pg;save();renderAll();window.scrollTo(0,0);return}
  const tb=e.target.closest('[data-b]');
  if(tb){const wasQ=TOOLPAGES.includes(S.cur.page);S.cur.page='brand';if(wasQ&&S.cur.brandId===tb.dataset.b){save();renderAll();return}if(S.cur.brandId!==tb.dataset.b){S.cur={brandId:tb.dataset.b,recipeId:null,cat:ALL,view:'rec',page:'brand'};catEdit=false;sideQuery=''}setMode('list');save();renderAll();return}
  if(e.target.closest('#addBrand')){const n=prompt('追加するブランド名');if(!n||!n.trim())return;const b={id:uid('b'),name:n.trim(),cats:[],recipes:[],props:[]};S.brands.push(b);S.cur={brandId:b.id,recipeId:null,cat:ALL,page:'brand'};save();renderAll()}
});
$('#tabs').addEventListener('dblclick',e=>{const tb=e.target.closest('[data-b]');if(!tb)return;const b=S.brands.find(x=>x.id===tb.dataset.b);const n=prompt('ブランド名を変更',b.name);if(n&&n.trim()){b.name=n.trim();save();renderAll()}});
function renderAll(){renderTabs();
  const q=TOOLPAGES.includes(S.cur.page);document.body.classList.toggle('v-quick',q);$('#subtabs').classList.toggle('hidden',q);
  document.body.classList.remove('n-edit','n-list');
  if(q){document.body.classList.remove('v-prop');setMode('list');$('#mobbar').innerHTML='';({quick:renderQuick,memo:renderMemo,task:renderTask})[S.cur.page]();return}
  renderSubtabs();document.body.classList.toggle('v-prop',!!curProp());const pr=curProp();if(pr){renderProp(pr)}else{S.cur.view='rec';renderBrand()}}
const curProp=()=>S.cur.view&&S.cur.view!=='rec'?curBrand().props.find(p=>p.id===S.cur.view)||null:null;
const propItems=(b,p)=>p.items.filter(x=>b.recipes.some(r=>r.id===x.rid));
function renderSubtabs(){
  const b=curBrand(),v=S.cur.view||'rec';
  $('#subtabs').innerHTML=`<button class="stab rec ${v==='rec'?'on':''}" data-v="rec">📋 レシピ<span class="n">${b.recipes.length}</span></button><span class="stlabel">提案会：</span>`
   +b.props.map(p=>`<button class="stab ${v===p.id?'on':''}" data-v="${p.id}">🍽 ${esc(p.name)}<span class="n">${propItems(b,p).length}</span></button>`).join('')
   +`<button class="stab add" id="addProp">＋ 提案会を作成</button>`;
  $('#subtabs').querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{S.cur.view=el.dataset.v;save();renderAll();window.scrollTo(0,0)});
  $('#addProp').onclick=()=>{const n=(prompt('提案会の名前（例：2026冬メニュー提案会）')||'').trim();if(!n)return;const p={id:uid('p'),name:n,date:'',items:[]};b.props.push(p);S.cur.view=p.id;save();renderAll()};
  $('#subtabs .stab.on')?.scrollIntoView({inline:'nearest',block:'nearest'});
}

/* ===== 一覧（サイド） ===== */
let sideQuery='',catEdit=false;
function renderBrand(){
  const b=curBrand();
  $('#view').innerHTML=`<div class="wrap">
    <aside class="card side" id="side">
      <div style="display:flex;align-items:center;gap:8px"><div class="brandttl" style="flex:1">${esc(b.name)}</div><span style="font-size:12px;color:var(--sub)" id="bcount">${b.recipes.length}品</span></div>
      <button class="btn pri block newbtn" id="btnNew" style="margin-top:8px">＋ 新規商品を作成</button>
      <input class="search" id="sideSearch" placeholder="🔍 商品名・略称で検索" value="${esc(sideQuery)}">
      <div class="chips" id="chips"></div>
      <div id="catmgr"></div>
      <div id="rlist"></div>
      <div class="tools">
        <div class="cap" id="toolCap"></div>
        <button class="btn grn block" id="btnXlsList">📊 Excel出力</button>
        <button class="btn block" id="btnPdfList">🖨 PDF出力</button>
        <button class="btn block" id="btnImport">📥 レシピExcelを取り込む</button>
      </div>
    </aside>
    <main class="ed" id="ed"></main></div>`;
  $('#btnNew').onclick=$('#fab').onclick=createRecipe;
  $('#sideSearch').oninput=e=>{sideQuery=e.target.value;renderList()};
  $('#btnXlsList').onclick=()=>exportExcel(b,visibleRecipes());
  $('#btnPdfList').onclick=()=>printRecipes(b,visibleRecipes());
  $('#btnImport').onclick=()=>$('#fileXlsx').click();
  renderChips();renderList();renderEditor();
}
function createRecipe(){const b=curBrand();const r=newRecipe(S.cur.cat);b.recipes.push(r);S.cur.recipeId=r.id;save();renderList();renderEditor();setMode('edit');window.scrollTo(0,0);setTimeout(()=>$('#f_name')?.focus(),60)}
function visibleRecipes(){
  const b=curBrand(),q=norm(sideQuery),c=S.cur.cat;
  const order=id=>{const i=b.cats.findIndex(x=>x.id===id);return i<0?9999:i};
  return b.recipes.filter(r=>(c===ALL||(c===NOCAT?!catName(b,r.catId):r.catId===c))&&(!q||norm(r.name+r.short).includes(q)))
    .sort((x,y)=>order(x.catId)-order(y.catId));
}
function renderChips(){
  const b=curBrand();const cnt=id=>b.recipes.filter(r=>id===NOCAT?!catName(b,r.catId):r.catId===id).length;
  const none=cnt(NOCAT);
  if(S.cur.cat!==ALL&&S.cur.cat!==NOCAT&&!b.cats.find(c=>c.id===S.cur.cat))S.cur.cat=ALL;
  $('#chips').innerHTML=`<button class="chip ${S.cur.cat===ALL?'on':''}" data-c="${ALL}">すべて<span class="n">${b.recipes.length}</span></button>`
    +b.cats.map(c=>`<button class="chip ${S.cur.cat===c.id?'on':''}" data-c="${c.id}">${esc(c.name)}<span class="n">${cnt(c.id)}</span></button>`).join('')
    +(none&&b.cats.length?`<button class="chip ${S.cur.cat===NOCAT?'on':''}" data-c="${NOCAT}">未分類<span class="n">${none}</span></button>`:'')
    +`<button class="chip set" id="catSet">${catEdit?'✓ 完了':'⚙ 分類を編集'}</button>`;
  $('#chips').querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{S.cur.cat=el.dataset.c;save();renderChips();renderList()});

/* ===== 簡易計算 ===== */
const QUNITS=['g','ml','個','本'];
const QNONE='__nobrand';
let qQuery='',qBrandF=ALL;
function qBlankItem(){return{name:'',price:'',pack:'',unit:'g',qty:''}}
function qNew(brand){return{id:uid('q'),name:'',brand:brand||'',price:'',open:true,items:[qBlankItem(),qBlankItem(),qBlankItem()],ts:Date.now()}}
const qItemCost=it=>{const p=nz(it.pack);return p>0?nz(it.price)/p*nz(it.qty):0};
const qCost=q=>q.items.reduce((a,it)=>a+qItemCost(it),0);
const qBrandList=()=>{const used=S.quick.map(q=>(q.brand||'').trim()).filter(Boolean);return[...new Set([...S.brands.map(b=>b.name),...used])]};
function qVisible(){
  const t=norm(qQuery);
  return S.quick.filter(q=>{const br=(q.brand||'').trim();
    if(qBrandF===QNONE?br:(qBrandF!==ALL&&br!==qBrandF))return false;
    if(t&&!norm(q.name+' '+br+' '+q.items.map(i=>i.name).join(' ')).includes(t))return false;return true});
}
function qSumHTML(q){const t=qCost(q),p=num(q.price),cnt=q.items.filter(i=>i.name).length;
  return `<span class="arw">▶</span><div class="nm"><b>${esc(q.name||'（商品名未入力）')}</b><small>${q.brand?`<span class="bpill">${esc(q.brand)}</span>`:''}商材 ${cnt}点</small></div>
    <div class="nums"><div>合計原価<b>${yen(t,1)}</b></div><div>売価<b>${p>0?'¥'+p.toLocaleString():'—'}</b></div><div class="rt">原価率<b>${p>0?pct(t/p):'—'}</b></div></div>`}
function qCardHTML(q){
  return `<div class="card qcard ${q.open?'open':''}" data-q="${q.id}">
    <div class="qsum" data-qtoggle>${qSumHTML(q)}</div>
    <div class="qbody">
    <div class="qhead">
      <div class="fld name"><label>商品名</label><input data-qf="name" value="${esc(q.name)}" placeholder="例：きのこのアヒージョ"></div>
      <div class="fld"><label>ブランド（選択 or 入力）</label><input data-qf="brand" list="qBrandList" value="${esc(q.brand)}" placeholder="選択または入力"></div>
      <button class="x" data-qdel>🗑 削除</button>
    </div>
    <div class="qh"><div>商材名</div><div>仕入値(円)</div><div>内容量</div><div>単位</div><div>使用量</div><div>商材原価</div><div></div></div>
    <div class="qitems">${q.items.map((it,i)=>`<div class="qr" data-i="${i}">
      <div class="q-name"><label>商材名</label><input data-if="name" value="${esc(it.name)}" placeholder="商材名"></div>
      <div class="q-price"><label>仕入値(円)</label><input inputmode="decimal" data-if="price" value="${esc(it.price)}"></div>
      <div class="q-pack"><label>内容量</label><input inputmode="decimal" data-if="pack" value="${esc(it.pack)}"></div>
      <div class="q-unit"><label>単位</label><select data-if="unit">${QUNITS.map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div class="q-qty"><label>使用量</label><input inputmode="decimal" data-if="qty" value="${esc(it.qty)}"></div>
      <div class="qc" data-qc="${i}">${yen(qItemCost(it),1)}</div>
      <button class="del" data-idel title="削除">✕</button></div>`).join('')}</div>
    <div class="qfoot">
      <div class="qadd"><button class="btn" data-iadd>＋ 商材を追加</button></div>
      <div class="kpi hl"><div class="l">合計原価</div><div class="v" data-qt>—</div></div>
      <div class="kpi"><div class="l">想定売価（税抜）</div><input inputmode="decimal" data-qf="price" value="${esc(q.price)}" placeholder="例：600"></div>
      <div class="kpi"><div class="l">原価率</div><div class="v" data-qr>—</div></div>
    </div></div></div>`;
}
function renderQuick(){
  setMode('list');$('#mobbar').innerHTML='';
  const brands=qBrandList();

function renderQList(){
  const list=qVisible();
  if(!list.length){$('#qlist').innerHTML=`<div class="card empty">${S.quick.length?'該当する商品がありません':'「＋ 商品を追加」から簡易計算を始めてください'}</div>`;return}
  let html='';
  if(qBrandF===ALL){
    const order=qBrandList();const groups=new Map();
    list.forEach(q=>{const k=(q.brand||'').trim()||'ブランド未設定';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(q)});
    const keys=[...groups.keys()].sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return(ia<0?999:ia)-(ib<0?999:ib)});
    keys.forEach(k=>{html+=`<div class="qgrp"><span>${esc(k)}</span><span>${groups.get(k).length}品</span></div>`+groups.get(k).map(qCardHTML).join('')});
  }else html=list.map(qCardHTML).join('');
  $('#qlist').innerHTML=`<div style="display:grid;gap:8px">${html}</div>`;
  list.forEach(qRefresh);

function qRefresh(q){const c=document.querySelector(`[data-q="${q.id}"]`);if(!c)return;
  q.items.forEach((it,i)=>{const e=c.querySelector(`[data-qc="${i}"]`);if(e)e.textContent=yen(qItemCost(it),1)});
  const t=qCost(q),p=num(q.price);c.querySelector('[data-qt]').textContent=yen(t,1);c.querySelector('[data-qr]').textContent=p>0?pct(t/p):'—';
  c.querySelector('.qsum').innerHTML=qSumHTML(q)}
const qOf=el=>S.quick.find(q=>q.id===el.closest('[data-q]')?.dataset.q);
document.addEventListener('input',e=>{const t=e.target;if(!t.closest('#qlist'))return;const q=qOf(t);if(!q)return;
  if(t.dataset.qf){q[t.dataset.qf]=t.value}else if(t.dataset.if){q.items[+t.closest('.qr').dataset.i][t.dataset.if]=t.value}else return;q.ts=Date.now();save();qRefresh(q)});
document.addEventListener('change',e=>{const t=e.target;if(!t.closest('#qlist'))return;const q=qOf(t);if(!q)return;
  if(t.tagName==='SELECT'){q.items[+t.closest('.qr').dataset.i].unit=t.value;q.ts=Date.now();save()}
  else if(t.dataset.qf==='brand'){q.brand=t.value.trim();save();const y=window.scrollY;renderQuick();window.scrollTo(0,y)}});
document.addEventListener('click',e=>{const t=e.target;if(!t.closest('#qlist'))return;const q=qOf(t);if(!q)return;
  if(t.closest('[data-qtoggle]')){q.open=!q.open;save();t.closest('.qcard').classList.toggle('open',q.open);return}
  if(t.closest('[data-iadd]')){q.items.push(qBlankItem());save();renderQList();setTimeout(()=>{const r=document.querySelectorAll(`[data-q="${q.id}"] .qr`);r[r.length-1]?.querySelector('input')?.focus()},40)}
  else if(t.closest('[data-idel]')){q.items.splice(+t.closest('.qr').dataset.i,1);if(!q.items.length)q.items.push(qBlankItem());save();renderQList()}
  else if(t.closest('[data-qdel]')){if((q.name||q.items.some(i=>i.name))&&!confirm(`「${q.name||'この商品'}」を削除しますか？`))return;S.quick=S.quick.filter(x=>x!==q);save();renderQuick()}});
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||e.shiftKey)return;const r=e.target.closest('#qlist .qr');if(!r)return;const q=qOf(r);
  if(+r.dataset.i!==q.items.length-1||e.target.dataset.if!=='qty')return;e.preventDefault();q.items.push(qBlankItem());save();renderQList();

/* ===== メモ帳 ===== */
let memoQ='',memoSel=null;
const fmtTs=t=>{if(!t)return'';const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
const brandOpts=v=>`<option value="">ブランドなし</option>`+[...new Set([...S.brands.map(b=>b.name),v].filter(Boolean))].map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('');
function renderMemo(){
  const q=norm(memoQ);
  const list=S.memos.filter(m=>!q||norm(m.title+m.body+m.brand).includes(q)).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.ts||0)-(a.ts||0));
  if(!S.memos.find(m=>m.id===memoSel))memoSel=isMob()?null:(list[0]?.id||null);

let taskFil='open';
function renderTask(){
  const list=S.tasks.filter(t=>taskFil==='all'||(taskFil==='open'?!t.done:t.done)).sort((a,b)=>(a.done-b.done)||(a.created||a.ts||0)-(b.created||b.ts||0));
  const cnt=k=>S.tasks.filter(t=>k==='all'||(k==='open'?!t.done:t.done)).length;
  $('#view').innerHTML=`<div class="twrap">
   <div class="card tadd"><input id="tTitle" placeholder="＋ タスクを入力してEnter"><button class="btn pri" id="tAdd">追加</button></div>
   <div class="tfil">${[['open','未完了'],['done','完了'],['all','すべて']].map(([k,l])=>`<button class="chip ${taskFil===k?'on':''}" data-tf="${k}">${l}<span class="n">${cnt(k)}</span></button>`).join('')}
     ${S.tasks.some(t=>t.done)?'<button class="btn sm" id="tClr" style="margin-left:auto">完了済みを削除</button>':''}</div>
   <div class="card">${list.map(t=>`<div class="task ${t.done?'done':''}" data-t="${t.id}">
     <button class="ck" data-tk>${t.done?'✓':''}</button>
     <input class="tt" value="${esc(t.title)}">
     <button class="btn sm red" data-tdel>✕</button></div>`).join('')||`<div class="empty">${taskFil==='done'?'完了したタスクはありません':'タスクはありません 🎉'}</div>`}</div></div>`;
  const add=()=>{const v=$('#tTitle').value.trim();if(!v)return;const n=Date.now();S.tasks.push({id:uid('t'),title:v,done:false,created:n,ts:n});save();renderTabs();renderTask();$('#tTitle').focus()};
  $('#tAdd').onclick=add;$('#tTitle').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add()}};
  document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{taskFil=b.dataset.tf;renderTask()});
  $('#tClr')&&($('#tClr').onclick=()=>{const n=S.tasks.filter(t=>t.done).length;if(!confirm(`完了済み${n}件を削除しますか？`))return;S.tasks=S.tasks.filter(t=>!t.done);save();renderTabs();renderTask()});
  document.querySelectorAll('.task').forEach(el=>{const t=S.tasks.find(x=>x.id===el.dataset.t);
    el.querySelector('[data-tk]').onclick=()=>{t.done=!t.done;t.ts=Date.now();save();renderTabs();renderTask()};
    el.querySelector('[data-tdel]').onclick=()=>{if(!confirm(`「${t.title}」を削除しますか？`))return;S.tasks=S.tasks.filter(x=>x!==t);save();renderTabs();renderTask()};
    el.querySelector('.tt').oninput=e=>{t.title=e.target.value;t.ts=Date.now();save()}});
}

function refreshCalc(){

document.addEventListener('input',e=>{
  const row=e.target.closest('#items .irow');if(!row)return;const r=curRecipe(),it=r.items[+row.dataset.i],f=e.target.dataset.f;if(!f)return;

document.addEventListener('click',e=>{
  const btn=e.target.closest('#items [data-act]');if(!btn)return;
  const row=btn.closest('.irow'),r=curRecipe(),i=+row.dataset.i,it=r.items[i],a=btn.dataset.act;
  if(a==='del'){if(it.name&&!confirm(`「${it.name}」を削除しますか？`))return;r.items.splice(i,1)}
  else if(a==='up'&&i>0)[r.items[i-1],r.items[i]]=[r.items[i],r.items[i-1]];
  else if(a==='down'&&i<r.items.length-1)[r.items[i+1],r.items[i]]=[r.items[i],r.items[i+1]];
  else if(a==='mode'||a==='menu'){if(a==='menu'&&!confirm(it.mode==='fixed'?'仕入値から計算する入力に戻しますか？':'仕入値を使わず「原価を直接入力」に切り替えますか？'))return;
    if(it.mode==='fixed')it.mode='calc';else{it.cost=+itemCost(it).toFixed(2)||'';it.mode='fixed'}}
  else return;

document.addEventListener('keydown',e=>{
  const sg=$('#suggest');
  if(!sg.classList.contains('hidden')&&e.target.classList?.contains('in-name')){
    const o=[...sg.querySelectorAll('.so')];let k=o.findIndex(x=>x.classList.contains('on'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();k=e.key==='ArrowDown'?Math.min(o.length-1,k+1):Math.max(0,k-1);o.forEach((x,j)=>x.classList.toggle('on',j===k));o[k]?.scrollIntoView({block:'nearest'});return}
    if(e.key==='Enter'&&k>=0){e.preventDefault();o[k].dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));return}
    if(e.key==='Escape'){hideSuggest();return}
  }
  if(e.key==='Tab'&&!e.shiftKey){const row=e.target.closest('#items .irow');if(!row)return;const r=curRecipe();if(+row.dataset.i!==r.items.length-1)return;
    const ins=[...row.querySelectorAll('input')];if(e.target!==ins[ins.length-1])return;e.preventDefault();addItemRow()}

/* ---- 入力候補（過去に入力した商材から値をコピー） ---- */
let sugRow=-1;
function pastItems(){const b=curBrand(),r=curRecipe(),map=new Map();
  b.recipes.slice().sort((x,y)=>String(x.updated).localeCompare(String(y.updated))).forEach(x=>x.items.forEach(it=>{if(x===r&&r.items.indexOf(it)===sugRow)return;if(it.name&&it.mode!=='fixed'&&nz(it.pack)>0)map.set(norm(it.name),it)}));return[...map.values()]}
function openSuggest(input,i){
  sugRow=i;const q=norm(input.value);if(!q)return hideSuggest();
  const list=pastItems().filter(it=>norm(it.name).includes(q)&&norm(it.name)!==q).slice(0,30);
  if(!list.length)return hideSuggest();

const newer=(a,b)=>String(a.updated||'')>=String(b.updated||'');
function mergeData(d){

  d.brands.forEach(src=>{
    let b=S.brands.find(x=>x.id===src.id)||S.brands.find(x=>norm(x.name)===norm(src.name));
    if(!b){S.brands.push(JSON.parse(JSON.stringify(src)));add+=src.recipes.length+src.props.length;return}
    const cmap={};src.cats.forEach(c=>{let t=b.cats.find(x=>x.id===c.id)||b.cats.find(x=>x.name===c.name);if(!t){t={id:c.id,name:c.name};if(b.cats.some(x=>x.id===t.id))t.id=uid('c');b.cats.push(t)}cmap[c.id]=t.id});
    const rmap={};
    src.recipes.forEach(r0=>{const r=JSON.parse(JSON.stringify(r0));r.catId=cmap[r.catId]||'';
      const i=b.recipes.findIndex(x=>x.id===r.id||(r.name&&norm(x.name)===norm(r.name)&&norm(x.short)===norm(r.short)));
      if(i<0){if(S.brands.some(bb=>bb.recipes.some(x=>x.id===r.id)))r.id=uid('r');b.recipes.push(r);add++}
      else{const cur=b.recipes[i];r.id=cur.id;if(newer(r,cur)&&JSON.stringify(r)!==JSON.stringify(cur)){b.recipes[i]=r;upd++}}

    src.props.forEach(p0=>{const p=JSON.parse(JSON.stringify(p0));p.items=p.items.map(x=>Object.assign({},x,{rid:rmap[x.rid]||x.rid}));
      const t=b.props.find(x=>x.id===p.id)||b.props.find(x=>x.name===p.name);
      if(!t){b.props.push(p);add++;return}
      let ch=false;p.items.forEach(x=>{const y=t.items.find(z=>z.rid===x.rid);if(!y){t.items.push(x);ch=true}else{if(!y.mark&&x.mark){y.mark=x.mark;ch=true}if(x.memo&&y.memo!==x.memo&&!(y.memo||'').includes(x.memo)){y.memo=y.memo?y.memo+'\n'+x.memo:x.memo;ch=true}}});
      if(!t.date&&p.date){t.date=p.date;ch=true}if(ch)upd++});
  });
  [['quick'],['memos'],['tasks']].forEach(([k])=>d[k].forEach(x=>{const i=S[k].findIndex(y=>y.id===x.id);
    if(i<0){S[k].push(JSON.parse(JSON.stringify(x)));add++}
    else{const a=S[k][i];const nw=k==='quick'?((x.ts||0)>=(a.ts||0)):((x.ts||0)>(a.ts||0));const keepOpen=a.open;

  S.quick=S.quick.filter(q=>q.name||q.items.some(it=>it.name)||S.quick.length<=1);
  return{add,upd};
}

  const notes=String(r.notes||'').split('\n');while(notes.length&&!notes[notes.length-1].trim())notes.pop();
  notes.forEach((t,i)=>cell('F'+(footRow+2+i),t||null));
  const addImg=async(src,col,row0,mw,mh)=>{if(!src)return;const sz=await imgSize(src);if(!sz)return;const id=wb.addImage({base64:src,extension:/^data:image\/png/.test(src)?'png':'jpeg'});const s=Math.min(mw/sz.w,mh/sz.h);ws.addImage(id,{tl:{col,row:row0},ext:{width:Math.round(sz.w*s),height:Math.round(sz.h*s)},editAs:'oneCell'})};
  await addImg(r.photo,1,footRow+1,215,200);
  const p2=footRow+1+(notes.length?notes.length+2:0);await addImg(r.photo2,6,p2,215,Math.max(80,200-(p2-footRow-1)*20));
  ws.pageSetup.printArea=`A1:L${end}`;
}
function buildToc(wb,b,list){
  const ws=wb.addWorksheet('目次',{views:[{showGridLines:false}],pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  [2,14,22,36,10,10,9,16,12].forEach((w,i)=>ws.getColumn(i+1).width=w);const F={name:'游ゴシック',size:10};
  ws.getCell('B2').value=`◆ ${b.name} レシピ一覧`;ws.getCell('B2').font={name:'游ゴシック',size:12,bold:true};ws.getCell('B3').value=`出力日：${today()}`;ws.getCell('B3').font={name:'游ゴシック',size:9};
  ['分類','略称','正式名','売価(抜)','原価','原価率','ポーション','最終更新'].forEach((h,i)=>{const c=ws.getCell(5,i+2);c.value=h;c.font={...F,bold:true};c.fill=fill(C_BLUE);c.alignment={horizontal:'center'};c.border={top:thin,bottom:thin,left:thin,right:thin}});
  list.forEach((r,k)=>{const cost=recipeCost(r),p=num(r.price);[catName(b,r.catId),r.short||'',r.name||'',isFinite(p)?p:null,+cost.toFixed(2),p>0?cost/p:null,r.portion||'',r.updated||''].forEach((v,i)=>{const c=ws.getCell(6+k,i+2);c.value=v;c.font=F;c.border={top:thin,bottom:thin,left:thin,right:thin};if(i===3||i===4)c.numFmt=fmtYen;if(i===5)c.numFmt='0.0%'})});
}
async function exportExcel(b,list){
  if(!list.length)return toast('出力する商品がありません');
  try{toast('Excelを作成中…');await loadExcelJS();const wb=new ExcelJS.Workbook();wb.creator='原価計算ツール';
    const used=new Set(['目次']);if(list.length>1)buildToc(wb,b,list);
    for(const r of list)await buildRecipeSheet(wb,b,r,sheetName(r.short||r.name,used));
    const buf=await wb.xlsx.writeBuffer(),d=today().replace(/-/g,'');
    const lbl=S.cur.cat===ALL?'全商品':S.cur.cat===NOCAT?'未分類':catName(b,S.cur.cat);
    const fn=list.length===1?`レシピデータ_${b.name}_${(list[0].short||list[0].name||'新規').replace(/[\\\/:*?"<>|]/g,'')}_${d}.xlsx`:`レシピデータ_${b.name}_${lbl}_${d}.xlsx`;
    download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fn);toast('Excelを出力しました')}
  catch(err){console.error(err);alert(err.message||'Excel出力に失敗しました')}
}
/* ---- Excel取込 ---- */
$('#fileXlsx').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{toast('取り込み中…');await loadExcelJS();const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());await importWorkbook(wb)}catch(err){console.error(err);alert('取り込みに失敗しました：'+(err.message||err))}});
function cv(c){const v=c.value;if(v==null)return null;if(typeof v==='object'){if(v.richText)return v.richText.map(t=>t.text).join('');if('result'in v)return v.result??null;if(v.text)return v.text;return null}return v}
function cformula(c){const v=c.value;if(v&&typeof v==='object'){if(v.formula)return v.formula;if(v.sharedFormula)return c.formula||null}return null}
async function importWorkbook(wb){
  const b=curBrand(),got=[];
  for(const ws of wb.worksheets){
    if(!String(cv(ws.getCell('C1'))||'').includes('調理レシピ'))continue;
    const r=newRecipe('');r.items=[];r.steps=[];
    const cn=String(cv(ws.getCell('C2'))||'').trim();
    if(cn){let c=b.cats.find(x=>x.name===cn);if(!c){c={id:uid('c'),name:cn};b.cats.push(c)}r.catId=c.id}
    r.short=String(cv(ws.getCell('K2'))||ws.name);r.name=String(cv(ws.getCell('A3'))||'');
    const p=cv(ws.getCell('F3'));r.price=typeof p==='number'?p:'';r.portion=String(cv(ws.getCell('H4'))||'');
    let foot=31;for(let rr=7;rr<=Math.min(ws.rowCount,200);rr++){const a=String(cv(ws.getCell('A'+rr))||'');if(a.includes('【盛り付け例】')){foot=rr;r.photoNote=a.replace('【盛り付け例】','').trim();break}}
    let cur=null;
    for(let rr=7;rr<foot;rr++){
      const nm=cv(ws.getCell('B'+rr));
      if(nm!=null&&String(nm).trim()){const it={name:String(nm).trim(),qty:cv(ws.getCell('C'+rr))??'',unit:String(cv(ws.getCell('D'+rr))||'').normalize('NFKC').trim()};
        const fm=cformula(ws.getCell('E'+rr)),m=fm&&String(fm).replace(/^=/,'').match(/^\s*([\d.]+)\s*\/\s*([\d.]+)\s*\*\s*C\d+\s*$/);
        if(m)Object.assign(it,{mode:'calc',price:+m[1],pack:+m[2]});else{const v=cv(ws.getCell('E'+rr));Object.assign(it,{mode:'fixed',cost:typeof v==='number'?+v.toFixed(4):0})}
        r.items.push(it)}
      const no=cv(ws.getCell('F'+rr)),tx=cv(ws.getCell('G'+rr));
      if(no!=null&&String(no).trim()!==''){cur={text:String(tx??'')};if(typeof no!=='number')cur.mark=String(no);r.steps.push(cur)}
      else if(tx!=null&&String(tx).trim()){if(!cur){cur={text:''};r.steps.push(cur)}cur.text+=(cur.text?'\n':'')+String(tx)}
    }
    if(!r.steps.length)r.steps=[{text:''}];
    const notes=[];for(let rr=foot+1;rr<=Math.min(ws.rowCount,foot+30);rr++){const t=cv(ws.getCell('F'+rr));if(t!=null&&String(t).trim())notes.push(String(t))}r.notes=notes.join('\n');
    try{const imgs=ws.getImages().slice().sort((x,y)=>(x.range.tl.nativeCol??x.range.tl.col)-(y.range.tl.nativeCol??y.range.tl.col));
      for(let k=0;k<Math.min(2,imgs.length);k++){const im=wb.getImage(+imgs[k].imageId);if(!im||!im.buffer)continue;const url=URL.createObjectURL(new Blob([im.buffer],{type:'image/'+(im.extension==='png'?'png':'jpeg')}));const d=await compressImage(url);URL.revokeObjectURL(url);if(k===0)r.photo=d;else r.photo2=d}}catch(err){console.warn(err)}
    got.push(r);
  }
  if(!got.length)return alert('「調理レシピ」形式のシートが見つかりませんでした');
  b.recipes.push(...got);S.cur.recipeId=null;S.cur.cat=ALL;save();renderAll();setMode('list');toast(`${b.name} に ${got.length} 件取り込みました`);
}
/* ===== 起動 ===== */
window.addEventListener('resize',()=>{if(S&&TOOLPAGES.includes(S.cur.page))return;if(!isMob())setMode(curRecipe()?'edit':'list')});
(async()=>{
  S=await loadState();try{const bk=JSON.parse(localStorage.getItem(KEY+'_bk')||'null');if(bk&&bk.v===2&&(!S||(bk.ts||0)>(S.ts||0)))S=bk}catch(_){}
  if(!S||S.v!==2){S=initState();await doSave()}
  S.brands.forEach(b=>{b.props=b.props||[];b.cats=b.cats||[]});S.quick=S.quick||[];S.memos=S.memos||[];S.tasks=S.tasks||[];
  S.quick.forEach(q=>{if(q.open===undefined)q.open=false});
  if(!S.brands.find(b=>b.id===S.cur.brandId))S.cur={brandId:S.brands[0].id,recipeId:null,cat:ALL};
  S.cur.page='quick';
  $('#saveState').textContent='✓ このブラウザに自動保存';
  if(isMob())S.cur.recipeId=null;
  renderAll();
})();
</script>
